constitution:
  project_name: jcode-go
  version: 1.0.0
  ratified: 2026-08-10
  last_amended: 2026-08-10
preamble: |
  jcode-go is the Go SDK for the Jcode harness protocol v1. Changes preserve
  compatibility and the sole-ownership boundaries in docs/architecture.md.
principles:
  - name: Protocol and Source Compatibility
    id: PRIN-001
    category: architecture
    priority: NON-NEGOTIABLE
    description: Preserve raw Request, Notify, Subscribe, Session.Send, Session.Events, Client.Close, and protocol v1 behavior through minimal additive changes.
    rationale: Existing SDK callers must upgrade without rewrites or hidden replay semantics.
    enforcement:
      - mechanism: Compatibility tests
        description: Protect every existing public path touched by lifecycle work.
    exceptions: []
  - name: Explicit Lifecycle Ownership
    id: PRIN-002
    category: architecture
    priority: NON-NEGOTIABLE
    description: Client owns correlation and subscriptions, Turn owns one prompt lifecycle, and Instance owns private Linux processes and paths.
    rationale: Sole ownership prevents competing readers, duplicate cancellation, retries, and cleanup races.
    enforcement:
      - mechanism: Architecture review
        description: Implement only the responsibility assigned by docs/architecture.md.
    exceptions: []
  - name: Test-First Race Safety
    id: PRIN-003
    category: quality
    priority: NON-NEGOTIABLE
    description: Define new behavior with focused failing tests and implement race-safe first-winner synchronization with bounded queues.
    rationale: Lifecycle correctness depends on observable concurrent behavior.
    enforcement:
      - mechanism: Focused and race tests
        description: Run focused tests first and race-enabled lifecycle tests before handoff.
    exceptions: []
  - name: Contextual Redacted Errors
    id: PRIN-004
    category: security
    priority: MUST
    description: Wrap operation causes for errors.Is and errors.As without exposing prompts, credentials, provider response text, raw frames, or private session identifiers.
    rationale: Callers need inspectable failures without sensitive data leakage.
    enforcement:
      - mechanism: Error-path tests and diff review
        description: Verify cause preservation and redaction.
    exceptions: []
  - name: Bounded Scope and Validation
    id: PRIN-005
    category: process
    priority: MUST
    description: Work only in the assigned worktree and Bead scope, then run formatting, focused tests, full tests, race tests, diff checks, and an explicit-file commit.
    rationale: Parallel lifecycle work must integrate without ownership conflicts.
    enforcement:
      - mechanism: Validation and Git review
        description: Require project checks and a clean committed worktree.
    exceptions: []
sections:
  - name: Go Implementation
    content: Prefer focused Go-idiomatic functions and standard library synchronization over speculative frameworks.
  - name: Non-Goals
    content: Do not add retry, reconnect, Windows supervision, process cleanup, Locus policy, provider fallback, or observability expansion.
  - name: Validation
    content: Run go test ./... -count=1, race-enabled lifecycle tests, gofmt, and git diff --check.
governance:
  amendment_process:
    - step: 1
      action: Compare proposed changes with architecture and repository instructions.
      requirements: Stop on ownership or compatibility conflicts.
    - step: 2
      action: Update dependent Autospec artifacts.
      requirements: Record scope, acceptance, and validation changes.
    - step: 3
      action: Validate and review.
      requirements: Pass repository checks before commit.
  versioning_policy: Semantic versioning for governance changes.
  compliance_review: Each implementation plan checks every principle and records validation evidence.
