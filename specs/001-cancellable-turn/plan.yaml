plan:
  branch: agent/jcode-go-70h-2
  created: 2026-08-10
  spec_path: specs/001-cancellable-turn/spec.yaml
summary: |
  Add Session.StartTurn and a focused Turn implementation that owns one internal
  subscription, one dispatcher, acceptance state, bounded ordered typed events,
  one shared protocol cancel attempt, and one immutable terminal result. Preserve
  every legacy API. Add one private Client correlated-reply observer so cancel ok
  is serialized on the reader before a following turn_done can be dispatched.
technical_context:
  language: Go
  framework: standard library
  primary_dependencies:
    - name: github.com/ariel-frischer/jcode-go/protocol
      version: module-local
      purpose: Construct send_message and cancel requests and inspect protocol events.
    - name: sync
      version: standard library
      purpose: Serialize first-terminal-wins state and one cancellation attempt.
    - name: context
      version: standard library
      purpose: Separate lifecycle causes from per-method wait interruption.
  storage: none
  testing:
    framework: Go testing with transport.NewPipePair and transport.NewFakeServer
    approach: Focused failing tests first, repeated cancellation stress, focused race tests, then full and full-race suites.
  target_platform: Portable Go API inside a Linux-only private-runtime stability program
  project_type: library
  performance_goals: One dispatcher and one lifecycle watcher per live Turn with bounded queues and a nonblocking Client reader.
  constraints:
    - Preserve protocol v1 and all existing public signatures.
    - Reserve final exported terminal taxonomy for jcode-go-70h.4.
    - Do not add retry, reconnect, process supervision, provider fallback, Locus policy, or observability expansion.
    - Exclude sensitive prompt, provider, credential, frame, and session data from new errors.
  scale_scope: One Turn per prompt using existing Client request correlation and subscriptions.
