research_findings:
  decisions:
    - topic: Terminal taxonomy boundary
      decision: Define TurnResultKind and TurnResult now but keep provisional kind constants unexported.
      rationale: Architecture requires the shape while jcode-go-70h.4 owns final exported names and comprehensive classes.
      alternatives_considered:
        - Export the full taxonomy early.
        - Leave Kind permanently empty.
    - topic: Event ownership and buffering
      decision: Start one dispatcher before send_message; hide message_accepted from Next; give the public Turn queue one reserved turn_done slot and the private raw subscription two extra internal slots.
      rationale: Waiters cannot steal frames, the Client reader stays nonblocking, normal overflow remains bounded, and a terminal event can follow a full public queue.
      alternatives_considered:
        - Multiple raw readers or subscriptions.
        - Blocking or unbounded user queues.
    - topic: Lifecycle and method contexts
      decision: Lifecycle completion stores the context cause and never sends cancel; method contexts only interrupt their own waits.
      rationale: This implements the architecture's explicit local-versus-server cancellation distinction.
      alternatives_considered:
        - Automatically send cancel from lifecycle cancellation.
        - Let method context expiry terminate the Turn.
    - topic: Shared cancel attempt
      decision: sync.Once launches one background request bounded by Client.RequestTimeout while callers wait using their own contexts.
      rationale: Caller wait expiry cannot abort or retry the shared mutating operation.
      alternatives_considered:
        - Use the first caller context for the request.
        - Send cancel as an uncorrelated notification.
    - topic: Cancel reply ordering
      decision: Add private Client.requestWithReplyObserver and mark cancel_requested on the reader when ok is removed from pending, before later asynchronous events.
      rationale: Stress testing showed immediate ok then turn_done was misclassified about 40 percent of runs when state changed only after Request returned.
      alternatives_considered:
        - Mark cancellation before server success.
        - Delay turn_done indefinitely while waiting for a cancel result.
    - topic: Provider errors
      decision: Preserve EventError.Code but omit EventError.Message on new Turn paths.
      rationale: Callers retain typed inspection without provider response leakage.
      alternatives_considered:
        - Reuse full legacy stream errors.
        - Return an opaque generic failure.
implementation_design:
  files:
    - path: session.go
      changes: Add StartTurn preflight, request construction, internal subscription ownership, dispatcher start, and write completion.
    - path: turn.go
      changes: Add Turn API, bounded dispatcher, acceptance, lifecycle causes, one cancel attempt, ordered Next, and immutable Wait.
    - path: client.go
      changes: Add private per-pending-request observer and internal subscription buffer helper without changing public Request or Subscribe.
    - path: turn_test.go
      changes: Add deterministic lifecycle, provider, buffering, cancellation race, cause, and legacy compatibility coverage.
  concurrency_model:
    state_lock: One Turn mutex protects state, acceptance, cancellation result, and terminal result.
    dispatcher: Sole raw Subscription reader and sole closer of the public event channel.
    cancellation: sync.Once plus cancelDone share one request result; a nonblocking reader callback serializes ok before following events.
    terminal: One locked first-winner path stores result and closes wait channels once.
  error_model:
    method_waits: Return operation-wrapped context errors without changing the Turn.
    lifecycle: Store operation-wrapped context.Cause.
    provider: Store redacted EventError with stable Code.
    cancellation: Share wrapped construction, transport, server-code, or unexpected-reply errors without making them terminal.
api_contracts:
  methods:
    - signature: func (s Session) StartTurn(lifecycleCtx context.Context, content string, options SendOptions) (*Turn, error)
      behavior: Reject NoReply or already-ended lifecycle, subscribe before send_message, and return after successful write.
    - signature: func (t *Turn) Accepted(ctx context.Context) error
      behavior: Expose acceptance independently; method context only interrupts this call.
    - signature: func (t *Turn) Next(ctx context.Context) (TypedEvent, error)
      behavior: Return typed events in dispatcher order and terminal cause or io.EOF after drain.
    - signature: func (t *Turn) Cancel(ctx context.Context) error
      behavior: Start at most one correlated cancel and return the shared attempt result or caller wait interruption.
    - signature: func (t *Turn) Wait(ctx context.Context) (TurnResult, error)
      behavior: Return one immutable result with nil wait error once terminal.
validation_strategy:
  focused:
    - go test ./... -run 'TestTurn|TestStartTurn|TestSessionSend|TestSessionEvents' -count=10
    - go test ./... -run '^TestTurnCancelReplyImmediatelyFollowedByTerminalIsCanceled$' -count=1000
    - go test -race ./... -run 'TestTurn|TestStartTurn|TestSessionSend|TestSessionEvents' -count=10
  full:
    - go test ./... -count=1
    - go test -race ./... -count=1
    - git diff --check
  review:
    - Validate all Autospec YAML artifacts.
    - Inspect new errors for sensitive data.
    - Stage explicit files and verify a clean branch after commit.
risks:
  - risk: A private Client hook changes pending request internals.
    likelihood: low
    impact: medium
    mitigation: Public Request behavior is unchanged and the full request correlation suite is rerun under race.
  - risk: Ordinary EOF can leave lower-level subscriptions waiting.
    likelihood: medium
    impact: high
    mitigation: Full transport terminal mapping remains explicitly assigned to jcode-go-70h.4; lifecycle contexts still bound local supervision.
  - risk: Provisional result kinds constrain later taxonomy.
    likelihood: low
    impact: medium
    mitigation: Constants remain unexported and .4 ownership is documented.
  - risk: A caller never consumes events.
    likelihood: medium
    impact: low
    mitigation: Bounded queues terminate only that Turn with ErrSubscriberOverflow.
