key_entities:
  - name: Turn
    description: One owned prompt lifecycle with acceptance, event dispatch, cancellation, and terminal result.
    attributes: [subscription, dispatcher, acceptance, cancellation attempt, terminal result]
  - name: TurnResult
    description: Minimal additive result shape whose final exported taxonomy belongs to jcode-go-70h.4.
    attributes: [Kind, Err]
  - name: Pending reply observer
    description: Private Client ordering hook used only to serialize cancel ok before following asynchronous events.
    attributes: [correlated reply, nonblocking callback]
edge_cases:
  - scenario: turn_done races ahead of the acceptance waiter.
    expected_behavior: Successful completion implies acceptance.
  - scenario: provider error occurs before or after acceptance.
    expected_behavior: Wait records one redacted provider failure while prior acceptance remains successful.
  - scenario: cancel ok and turn_done arrive back-to-back.
    expected_behavior: The result is explicit server cancellation.
  - scenario: natural turn_done arrives before the cancel reply.
    expected_behavior: Natural completion wins immutably.
  - scenario: a method-only wait context expires.
    expected_behavior: Only that call returns a wrapped context error.
  - scenario: public event consumption falls behind.
    expected_behavior: Only the Turn terminates with ErrSubscriberOverflow.
assumptions:
  - Protocol v1 cancel is a correlated request containing session_id and returning ok or error.
  - Protocol v1 turn_done has no cancellation reason, so locally serialized cancel acceptance determines classification.
  - jcode-go-70h.4 will add the final exported result constants and complete transport taxonomy.
constraints:
  - Work only in the assigned worktree and branch.
  - Preserve all APIs named by docs/architecture.md.
  - Do not mutate Beads, push, merge main, delegate, or change providers.
  - Commit only Bead-owned code, tests, and Autospec artifacts.
out_of_scope:
  - Final terminal taxonomy and complete transport or bridge mapping owned by jcode-go-70h.4.
  - Retry, reconnect, request replay, provider fallback, Locus policy, and observability expansion.
  - Linux process supervision owned by jcode-go-70h.3 and all Windows work.
  - Live OAuth validation, README examples, and deployment.
