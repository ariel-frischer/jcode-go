research_findings:
  decisions:
    - topic: "Process ownership and signaling"
      decision: "Set SysProcAttr.Setpgid before Start, record cmd.Process.Pid as the owned group ID, and signal only negative recorded IDs greater than one."
      rationale: "This reaches descendants without system discovery and satisfies the architecture's sole ownership boundary."
      alternatives_considered:
        - "Signal only the bridge PID, which can leave descendants orphaned."
        - "Scan process names or the system process table, which is explicitly forbidden."
    - topic: "Single bounded reap"
      decision: "Keep one buffered waitDone channel fed by exactly one cmd.Wait goroutine and consume it through grace/reap selects without calling Wait elsewhere."
      rationale: "The channel preserves the current structure while making every receive finite and naturally sharing one reap across callers."
      alternatives_considered:
        - "Call cmd.Wait from each shutdown entry point, which is invalid and race-prone."
        - "Wait indefinitely after Kill, which violates the bounded contract."
    - topic: "Context-aware compatibility"
      decision: "Add ShutdownInstance(ctx, instance) and use an unexported context-shutdown capability implemented by launchedInstance; foreign Instance implementations retain the existing Shutdown call path."
      rationale: "This adds context behavior for SDK-owned instances without breaking external implementations of the exported interface."
      alternatives_considered:
        - "Add ShutdownContext to Instance, which is a breaking interface change."
        - "Make existing Shutdown accept context, which breaks callers."
    - topic: "Shutdown result sharing"
      decision: "Use one mutex-guarded shutdown owner, a shared completion channel, and one stored errors.Join result."
      rationale: "The guarded owner blocks concurrent callers until one finite sequence completes, permits caller contexts to request immediate escalation, and guarantees every caller reads the same immutable stored error."
      alternatives_considered:
        - "Independent shutdown attempts, which duplicate signaling and cleanup."
        - "Return early to later callers on their own context, which would violate the shared completed-result invariant."
    - topic: "Owned path cleanup"
      decision: "Record the exact runtime directory and expected socket paths at launch, validate the runtime as a real directory below the recorded home, remove that owned runtime tree, and remove the home only when the SDK created a temp-prefix home."
      rationale: "The runtime directory is per-instance and safe to remove recursively after process termination, while caller-owned durable home state remains untouched."
      alternatives_considered:
        - "Use ambient JCODE_HOME during shutdown, which can drift."
        - "Remove a caller-supplied home, which violates ownership."
        - "Remove only one socket and leave other private runtime files behind."
    - topic: "Client close versus detach"
      decision: "Under stateMu, closing sets StateClosing, claims and clears instance, then releases the mutex before performing transport and instance shutdown. Detach rejects closing or closed clients."
      rationale: "One atomic ownership decision prevents both transfer and client shutdown from winning."
      alternatives_considered:
        - "Read instance after closing transport without clearing it, which allows a detach race."
        - "Hold stateMu through shutdown, which creates unnecessary lock coupling and blocking."

# No persistent domain data model or network API is introduced. These entries describe internal lifecycle state only.
data_model:
  entities:
    - name: "launchedInstance"
      description: "One SDK-owned private Linux runtime and its immutable ownership record plus shared shutdown state."
      fields:
        - name: "processGroupID"
          type: "int"
          description: "Recorded bridge process group ID used for negative group signaling."
          constraints: "Must be greater than one before any group signal."
        - name: "waitDone"
          type: "receive-only channel of error"
          description: "Single result produced by the sole cmd.Wait goroutine."
          constraints: "Consumed at most once and only through finite selects."
        - name: "owned paths"
          type: "absolute or cleaned path strings"
          description: "Recorded socket, runtime directory, and home ownership boundaries."
          constraints: "Cleanup validates containment and rejects symlinked root directories."
        - name: "shutdown result"
          type: "guarded error plus completion channel"
          description: "Immutable joined result shared after sync.Once completion."
          constraints: "Contains contextual operational causes but no sensitive protocol content."
      relationships: []
    - name: "Client instance attachment"
      description: "Optional sole ownership link from a launched Client to one Instance."
      fields:
        - name: "instance"
          type: "Instance"
          description: "Attached private runtime ownership before close or detach wins."
          constraints: "Claimed and cleared atomically under stateMu."
      relationships:
        - target: "launchedInstance"
          type: "one-to-one"
          description: "The launched client owns one private instance until detach transfers it."

