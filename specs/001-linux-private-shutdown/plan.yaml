summary: |
  Extend the existing private-instance launcher rather than introducing a generic lifecycle framework. Launch will request a new Unix process group before exec.Start, record the bridge PID as the owned process-group ID, create exactly one cmd.Wait goroutine, and construct a launchedInstance containing finite shutdown configuration and exact owned paths.

  The first shutdown caller becomes the guarded shutdown owner and performs one sequence shared by Instance.Shutdown, Instance.Close, ShutdownInstance, and client-owned shutdown. Concurrent callers wait on the same completion channel and may shorten the graceful phase through their contexts, but cannot run duplicate cleanup. The owner stops only the daemon matched by the private registry socket, signals the recorded process group with TERM, escalates to KILL when required, bounds consumption of the single wait result, and then cleans validated recorded runtime paths and an SDK-created ephemeral home. Client close atomically claims and clears its attached instance under the existing state mutex so DetachInstance cannot transfer ownership after closing begins.

