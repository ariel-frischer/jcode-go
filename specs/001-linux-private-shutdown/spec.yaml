feature:
  branch: "agent/jcode-go-70h-3"
  created: "2026-08-10"
  status: "Approved"
  input: "Make SDK-owned private-instance shutdown bounded and orphan-free on Linux within the jcode-go-70h.3 responsibility defined by docs/architecture.md and docs/sdk-stability-plan.md."

user_stories:
  - id: "US-001"
    title: "Bounded private instance shutdown"
    priority: "P0"
    as_a: "Go SDK caller supervising a private Jcode runtime"
    i_want: "shutdown to terminate the owned Linux process tree and finish within configured finite bounds"
    so_that: "cancellation and client closure cannot leave bridge processes or descendants running indefinitely"
    why_this_priority: "Unbounded shutdown can stall orchestrators and leak private workers."
    independent_test: "Launch controlled cooperative and TERM-ignoring process groups, invoke shutdown, and verify exit within grace and reap bounds."
    acceptance_scenarios:
      - given: "an SDK-owned bridge and descendants that cooperate with SIGTERM"
        when: "the instance is shut down"
        then: "the entire owned group exits during the configured TERM grace without requiring SIGKILL"
      - given: "an SDK-owned bridge or descendant that ignores SIGTERM"
        when: "the TERM grace expires or the caller context ends"
        then: "the recorded owned process group receives SIGKILL and shutdown completes after a bounded reap"
      - given: "a wait result channel that does not deliver"
        when: "shutdown reaches the reap phase"
        then: "shutdown returns a reap timeout error instead of blocking indefinitely"

  - id: "US-002"
    title: "Safe owned resource cleanup"
    priority: "P0"
    as_a: "Go SDK caller using private runtime state"
    i_want: "shutdown to remove only the instance-owned socket and runtime paths and any SDK-created ephemeral home"
    so_that: "private resources are cleaned without deleting caller-owned durable state or unrelated paths"
    why_this_priority: "Cleanup must be complete while remaining safe under caller-supplied homes and path manipulation."
    independent_test: "Create recorded runtime paths under ephemeral and caller-owned homes, shut down, and assert exact removal and retention boundaries."
    acceptance_scenarios:
      - given: "an SDK-created ephemeral JCODE_HOME"
        when: "shutdown finishes process termination attempts"
        then: "the socket, runtime directory, and ephemeral home are removed"
      - given: "a caller-supplied persistent JCODE_HOME"
        when: "shutdown completes"
        then: "the owned runtime directory is removed while the home and durable files remain"
      - given: "a path outside the recorded private home or a symlinked owned directory"
        when: "cleanup runs"
        then: "the path is retained and a contextual cleanup error is returned"

  - id: "US-003"
    title: "Atomic shared ownership"
    priority: "P0"
    as_a: "Go SDK caller racing client closure, detach, and direct shutdown"
    i_want: "exactly one owner and one shared immutable shutdown result"
    so_that: "the same private instance cannot be detached and shut down by the client or shut down multiple times"
    why_this_priority: "Ownership races can create both orphaning and use-after-transfer behavior."
    independent_test: "Race Client.Close against DetachInstance and invoke all shutdown entry points concurrently while counting a single shutdown execution."
    acceptance_scenarios:
      - given: "Client.Close and DetachInstance execute concurrently"
        when: "closing begins first"
        then: "close atomically claims and clears the instance and detach fails"
      - given: "detach completes first"
        when: "the client later closes"
        then: "client closure is transport-only and the detached caller retains shutdown ownership"
      - given: "multiple concurrent shutdown callers"
        when: "shutdown completes with success or failure"
        then: "all callers return the same stored result after one cleanup sequence"

requirements:
  functional:
    - id: "FR-001"
      description: "The SDK MUST place each launched bridge in a new owned process group before Start and record only a valid group identifier greater than one."
      testable: true
      acceptance_criteria: "Linux tests confirm the bridge process group ID equals its PID and no signaling path accepts PID or group values zero or one."
    - id: "FR-002"
      description: "Shutdown MUST signal SIGTERM to the recorded owned process group, wait for a finite configurable grace interval, and send SIGKILL when grace expires or an owned group member remains."
      testable: true
      acceptance_criteria: "Cooperative groups exit in grace and TERM-ignoring bridge descendants are absent within configured bounds."
    - id: "FR-003"
      description: "Shutdown MUST consume at most the single existing cmd.Wait result and MUST bound the reap wait even when the caller context is already done."
      testable: true
      acceptance_criteria: "A non-delivering wait result produces a finite reap timeout and repeated shutdown does not perform another wait."
    - id: "FR-004"
      description: "The SDK MUST ask only the instance-scoped daemon identified by the private registry socket to stop before registry cleanup."
      testable: true
      acceptance_criteria: "Registry fixtures match only the recorded runtime socket and reject missing, malformed, PID 0, and PID 1 entries."
    - id: "FR-005"
      description: "Shutdown MUST remove the recorded owned socket and runtime directory, remove an SDK-created ephemeral home, and retain caller-owned homes and durable state."
      testable: true
      acceptance_criteria: "Linux path tests prove exact removal for owned paths and retention for caller-owned homes and unrelated paths."
    - id: "FR-006"
      description: "The SDK MUST expose an additive context-aware ShutdownInstance helper without changing the exported Instance interface or existing method signatures."
      testable: true
      acceptance_criteria: "Existing callers compile and SDK-owned instances honor caller context only to shorten grace while still performing kill, bounded reap, and cleanup."
    - id: "FR-007"
      description: "Concurrent Instance.Shutdown, Instance.Close, ShutdownInstance, and client-owned shutdown calls MUST execute one sequence and return the same stored result."
      testable: true
      acceptance_criteria: "Race-enabled tests observe one shutdown execution and result identity or equivalent shared stored error across all callers."
    - id: "FR-008"
      description: "Client.Close and DetachInstance MUST serialize ownership so close atomically claims and clears the attached instance before shutdown and detach succeeds only before closing begins."
      testable: true
      acceptance_criteria: "Deterministic ownership race tests prove exactly one outcome in both orderings."
    - id: "FR-009"
      description: "Shutdown MUST continue through safe cleanup phases after errors and return contextual joined causes without sensitive content."
      testable: true
      acceptance_criteria: "Injected signal, context, reap, and path failures remain inspectable with errors.Is or wrapped context and do not expose prompts, credentials, frames, or session identifiers."
  non_functional:
    - id: "NFR-001"
      category: "reliability"
      description: "All Linux shutdown waits remain finite and non-positive duration configuration selects defaults rather than disabling bounds."
      measurable_target: "Default shutdown waits use 5 seconds TERM grace, 5 seconds reap, and the existing 30 seconds cleanup cap."
    - id: "NFR-002"
      category: "security"
      description: "Signals and removals are limited to recorded ownership and validated paths."
      measurable_target: "No code path signals PID 0, PID 1, or an unrecorded group, and no cleanup removes a path outside the recorded private home."
    - id: "NFR-003"
      category: "code_quality"
      description: "The implementation remains minimal, Linux-focused, Go-idiomatic, and race-safe."
      measurable_target: "Focused tests, full tests, and race-enabled tests pass with no exported Instance interface change."

success_criteria:
  measurable_outcomes:
    - id: "SC-001"
      description: "Cooperative shutdown completes during TERM grace."
      metric: "Elapsed shutdown time and child TERM marker"
      target: "Before configured grace expiry with no owned PID remaining"
    - id: "SC-002"
      description: "TERM-ignoring process groups are forcibly removed."
      metric: "Owned PID and descendant liveness after shutdown"
      target: "No owned process remains after grace plus reap bounds"
    - id: "SC-003"
      description: "Shutdown is idempotent under concurrency."
      metric: "Number of shutdown executions and returned stored results"
      target: "Exactly one execution and one shared result"
    - id: "SC-004"
      description: "Owned filesystem resources are cleaned safely."
      metric: "Post-shutdown existence checks"
      target: "Owned socket/runtime/ephemeral home absent and caller-owned home/durable files present"

key_entities:
  - name: "Owned private instance"
    description: "The SDK-owned lifecycle record for one launched bridge and its exact process and filesystem ownership."
    attributes:
      - "recorded process group ID"
      - "single wait result channel"
      - "instance-scoped daemon registry identity"
      - "socket and runtime directory"
      - "Jcode home and ephemeral ownership flag"
      - "finite grace, reap, and cleanup durations"
      - "shared shutdown result"

edge_cases:
  - scenario: "Caller context is already canceled when shutdown starts"
    expected_behavior: "Skip graceful waiting, retain the context cause, attempt SIGKILL, perform bounded reap, and clean owned paths."
  - scenario: "Bridge exits but a descendant remains in the recorded process group"
    expected_behavior: "Detect the remaining group and send SIGKILL without waiting indefinitely."
  - scenario: "Process or group is already absent"
    expected_behavior: "Treat ESRCH as successful cleanup."
  - scenario: "Repeated shutdown follows a reap timeout or cleanup failure"
    expected_behavior: "Return the same stored combined error without repeating effects."
  - scenario: "Runtime directory is a symlink or is outside the recorded home"
    expected_behavior: "Do not remove it and return a contextual ownership validation error."

assumptions:
  - "The assigned architecture commit c52fd6b is authoritative for public API and responsibility boundaries."
  - "Linux controlled-child integration tests provide sufficient deterministic evidence for this Bead and require no live provider."
  - "A daemon PID is owned only when read from the private home registry and matched to the recorded private runtime socket."

constraints:
  - "Preserve Instance.Shutdown, Instance.Close, Client.Close, and DetachInstance signatures."
  - "Do not add a method to the exported Instance interface."
  - "Implement Linux supervision only in launch.go and process_unix.go, with only minimal compatibility edits outside the assigned surface."
  - "Do not implement Windows parity, process-name scanning, system-wide discovery, turn APIs, retries, Locus policy, or provider fallback."
  - "Do not signal PID 0, PID 1, or an unrecorded process group."
  - "Do not remove paths outside the recorded ownership set."

out_of_scope:
  - "Windows process supervision parity"
  - "Turn lifecycle or terminal outcome taxonomy"
  - "System-wide process discovery or process-name scanning"
  - "Locus retry, cancellation, execution mode, or provider policy"
  - "Live OAuth or paid provider validation"

