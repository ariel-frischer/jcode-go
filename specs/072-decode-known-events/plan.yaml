  storage: "None"
  testing:
    framework: "Go testing package"
    approach: "Table-driven unit tests for typed decoding and semantic classes, existing lifecycle tests, raw protocol parity, full module tests, Linux private-runtime acceptance."
  target_platform: "Linux for private-runtime validation; portable protocol and event model"
  project_type: "library"
  performance_goals: "No additional goroutines, allocations beyond decoding the selected concrete payload, or unbounded buffers."
  constraints:
