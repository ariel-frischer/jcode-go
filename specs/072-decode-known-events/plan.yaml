research_findings:
  decisions:
    - topic: "Canonical event fields"
      decision: "Mirror Rust ApiEvent and TypeScript ApiEvent fields exactly, using pointers for optional values where absence changes meaning."
      rationale: "The public Go mirror consumes the canonical Jcode harness contract and must not invent a vocabulary."
      alternatives_considered:
        - "Keep raw JSON fields only"
        - "Use map[string]any payloads"
    - topic: "Semantic classes for requested reply-shaped events"
      decision: "Leave Models, RuntimeInfo, CredentialUpdated, FileContent, Files, TextMatches, FileStatus, Compacted, and SessionRenamed unclassified."
      rationale: "Rust publication_contract marks them OutsideOwnedTurn with no semantic class."
      alternatives_considered:
        - "Classify every event advisory_lifecycle"
        - "Add a new reply semantic class"
    - topic: "New canonical gaps beyond the Bead description"
      decision: "Include side_pane_images, message_accepted typed decoding, and ModelInfo.reasoning_effort."
      rationale: "Current canonical TypeScript/Rust contracts contain these fields/kinds while the Go mirror is incomplete."
      alternatives_considered:
        - "Implement only the stale event list"
    - topic: "Terminal error"
      decision: "Retain EventError as an error return rather than making it a TypedEvent."
      rationale: "Existing Session.Events and Turn terminal contracts already preserve code, provider code, and appropriate message redaction."
      alternatives_considered:
        - "Duplicate error as an ordinary stream value"

