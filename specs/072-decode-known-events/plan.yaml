plan:
  branch: "agent/jcode-go-7tf-events"
  created: "2026-08-22"
  spec_path: "specs/072-decode-known-events/spec.yaml"

summary: |
  Extend the existing hand-written typed-event model in session.go with canonical payload structs and exact decoder cases. The Rust ApiEvent publication contract remains authoritative: SidePaneImages is an owned content-progress event, message_accepted is an owned advisory event intercepted only by Turn, terminal error retains EventError, and request/reply-shaped events remain outside owned turns and therefore receive no SemanticClassOf class.

  Strengthen parity tests so canonical event additions cannot be present in Rust or TypeScript while absent from Go. Preserve genuinely unknown kinds as UnknownEvent and preserve bounded CompatibilityError behavior for malformed recognized payloads.

