feature:
  branch: "073-add-session-run-safety"
  created: "2026-08-22"
  status: "Draft"
  input: "Add typed session profile and run-safety options to the Go SDK: preserve zero-value legacy create_session requests, add an optional named profile plus max turns, token budget, and explicit-offset RFC3339 deadline through typed additive fields, validate invalid values before sending requests or turns, preserve raw protocol and owned Turn behavior, and cover omission, valid mapping, validation failures, and legacy compatibility with deterministic tests. Do not add max_tool_steps or provider credentials."

user_stories:
  - id: "US-001"
    title: "Create a session with a named profile"
    priority: "P1"
    as_a: "Go SDK consumer"
    i_want: "to optionally select a named session profile through the typed session-creation options"
    so_that: "the harness can apply a predefined configuration without requiring a raw protocol request"
    why_this_priority: "Typed profile selection is a core capability, while omission must remain fully compatible with existing callers."
    independent_test: "Capture the create-session request for both zero-value options and a named profile, then compare the transmitted fields."
    acceptance_scenarios:
      - given: "a caller uses zero-value session-creation options"
        when: "the caller creates a session"
        then: "the request is identical to the legacy zero-value create_session request and contains no profile field"
      - given: "a caller supplies a valid named profile"
        when: "the caller creates a session"
        then: "the request includes that profile name exactly once under the documented profile field"

  - id: "US-002"
    title: "Bound an individual turn"
    priority: "P1"
    as_a: "Go SDK consumer"
    i_want: "to optionally set maximum turns, a token budget, and an absolute deadline through typed turn options"
    so_that: "each submitted run has explicit resource and time limits"
    why_this_priority: "Run-safety controls are the primary protection delivered by this feature."
    independent_test: "Exercise both typed send paths with fixed option values, capture the outgoing turn request, and verify exact inclusion or omission of every safety field."
    acceptance_scenarios:
      - given: "a caller supplies valid maximum turns, token budget, and an RFC3339 deadline with an explicit timezone offset"
        when: "the caller sends a message or starts an owned turn"
        then: "the outgoing turn request contains each supplied limit without changing the existing content, image, or reply fields"
      - given: "a caller leaves every run-safety option at its zero value"
        when: "the caller sends a message or starts an owned turn"
        then: "none of the new fields is present and legacy request behavior is preserved"
      - given: "a caller supplies an invalid run-safety value"
        when: "the caller attempts to send a message or start an owned turn"
        then: "the operation fails before any request, notification, subscription, or owned turn is created"

  - id: "US-003"
    title: "Retain compatibility and ownership contracts"
    priority: "P1"
    as_a: "maintainer of an existing SDK integration"
    i_want: "existing typed and raw protocol calls to keep their established behavior"
    so_that: "adopting the additive options does not require migration or change turn ownership semantics"
    why_this_priority: "Protocol v1 and owned Turn compatibility are non-negotiable project guarantees."
    independent_test: "Run deterministic compatibility cases for raw requests, zero-value typed requests, Session.Send acceptance behavior, and the owned Turn lifecycle."
    acceptance_scenarios:
      - given: "an existing caller uses only legacy fields and methods"
        when: "the caller creates a session and submits work"
        then: "the serialized requests and observable lifecycle behavior remain unchanged"
      - given: "a caller constructs a raw protocol request"
        when: "the caller sends it through the raw API"
        then: "the request is neither rewritten nor subjected to the new typed-option validation"
      - given: "a caller starts an owned turn with valid safety options"
        when: "acceptance, events, cancellation, or terminal completion occurs"
        then: "the Turn retains its existing subscription ordering, ownership, cancellation, and immutable terminal-result behavior"

requirements:
  functional:
    - id: "FR-001"
      description: "The SDK MUST expose an optional named profile through the typed session-creation options."
      acceptance_criteria: "A valid non-blank profile is present in create_session with the caller-supplied value; an omitted profile produces no profile field."
    - id: "FR-002"
      description: "The SDK MUST preserve the exact legacy create_session payload when all typed session-creation options have zero values."
      acceptance_criteria: "A captured zero-value request has the same event name and fields as the pre-feature request, including omission of every newly introduced field."
    - id: "FR-003"
      description: "The SDK MUST expose optional positive maximum-turn and token-budget limits through the typed options shared by normal sends and owned turns."
      acceptance_criteria: "Each non-zero positive limit is mapped to its corresponding outgoing turn field on both typed paths, while each zero value is omitted."
    - id: "FR-004"
      description: "The SDK MUST expose an optional absolute deadline that accepts RFC3339 timestamps carrying an explicit timezone designator."
      acceptance_criteria: "A valid deadline with either Z or a numeric plus-or-minus HH:MM offset is transmitted as an RFC3339 value, and a zero-value deadline is omitted."
    - id: "FR-005"
      description: "The SDK MUST reject a profile that is present but blank, non-positive supplied limits, malformed deadlines, deadlines without a timezone designator, and deadlines already expired when submission begins."
      acceptance_criteria: "Each invalid case returns a stable validation error before any protocol request or notification is written."
    - id: "FR-006"
      description: "The SDK MUST validate typed turn options before creating a subscription or owned Turn and before sending the turn request."
      acceptance_criteria: "Deterministic failure tests observe no server frame, subscription, accepted turn, or lifecycle side effect for invalid options."
    - id: "FR-007"
      description: "The SDK MUST preserve existing Session.Send behavior for acceptance waits and notification-only sends when the new options are omitted or valid."
      acceptance_criteria: "Compatibility tests show the same return point, no-reply behavior, request content, images, and error behavior as before this feature."
    - id: "FR-008"
      description: "The SDK MUST preserve the existing owned Turn contract when valid run-safety fields are supplied."
      acceptance_criteria: "Tests show subscription-before-write ordering, event delivery, cancellation semantics, first-terminal-wins results, and wait behavior are unchanged."
    - id: "FR-009"
      description: "The SDK MUST leave protocol v1 raw Request, Notify, Subscribe, and raw request construction behavior unchanged."
      acceptance_criteria: "Existing raw protocol tests pass unchanged, and a raw caller can send protocol fields without typed-option rewriting or validation."
    - id: "FR-010"
      description: "The SDK MUST omit every new session or turn field unless the caller explicitly supplies a valid typed value."
      acceptance_criteria: "Captured requests for every zero-value combination contain none of profile, max_turns, token_budget, or deadline."
    - id: "FR-011"
      description: "The feature MUST NOT expose or transmit max_tool_steps or provider credentials."
      acceptance_criteria: "The public typed options and captured protocol requests contain no max_tool_steps field and no provider credential field."
    - id: "FR-012"
      description: "The SDK MUST cover omission, exact valid mapping, every documented validation failure, and legacy compatibility with deterministic tests."
      acceptance_criteria: "The test suite uses fixed inputs and controlled protocol peers, requires no live provider, and passes repeatedly with identical assertions."
  non_functional:
    - id: "NFR-001"
      category: "reliability"
      description: "Validation failures must be free of network and lifecycle side effects."
      measurable_target: "100% of invalid-option cases produce zero outgoing frames and zero created owned turns."
    - id: "NFR-002"
      category: "code_quality"
      description: "The public change must remain additive and preserve source compatibility for existing callers."
      measurable_target: "All existing package tests compile and pass without changes required in legacy call sites."
    - id: "NFR-003"
      category: "security"
      description: "Validation errors and test output must not expose prompts, responses, credentials, raw frames, or private session identifiers."
      measurable_target: "No new diagnostic assertion or emitted error contains any prohibited sensitive value."

success_criteria:
  measurable_outcomes:
    - id: "SC-001"
      description: "Existing consumers can upgrade without modifying zero-value session creation or turn submission calls."
      metric: "Legacy compatibility scenarios passing without request-shape changes"
      target: "100% of covered legacy scenarios"
    - id: "SC-002"
      description: "Consumers can express every requested profile and run-safety control through the typed SDK surface."
      metric: "Requested controls represented and mapped correctly"
      target: "4 of 4 controls: profile, maximum turns, token budget, and deadline"
    - id: "SC-003"
      description: "Invalid safety configurations are rejected before work reaches the harness."
      metric: "Invalid cases rejected with no outgoing operation"
      target: "100% of documented invalid cases"
    - id: "SC-004"
      description: "Compatibility and validation results are reproducible without live services."
      metric: "Repeated deterministic test runs producing the same pass result"
      target: "At least 10 consecutive runs with zero intermittent failures"

key_entities:
  - name: "Session profile selection"
    description: "The optional name of a predefined harness profile selected when creating a session."
    attributes:
      - "profile name"
      - "omitted when unspecified"
  - name: "Turn safety limits"
    description: "Optional per-turn bounds applied consistently to normal sends and owned turns."
    attributes:
      - "maximum turns"
      - "token budget"
      - "absolute RFC3339 deadline with timezone"
  - name: "Legacy request"
    description: "The unchanged protocol request produced by existing callers that do not opt into new fields."
    attributes:
      - "original field set"
      - "original lifecycle semantics"

edge_cases:
  - scenario: "Only one of the new optional values is supplied."
    expected_behavior: "Only that field is transmitted; all other new fields remain absent."
  - scenario: "A profile consists only of whitespace."
    expected_behavior: "The typed create-session call rejects it before writing a request."
  - scenario: "Maximum turns or token budget is negative."
    expected_behavior: "The typed send and owned-turn paths reject the value before any side effect."
  - scenario: "The deadline is syntactically RFC3339-like but omits a timezone designator."
    expected_behavior: "The typed turn operation rejects it before any side effect."
  - scenario: "The deadline uses UTC Z instead of a numeric offset."
    expected_behavior: "It is accepted as an explicit RFC3339 timezone designator and mapped without ambiguity."
  - scenario: "The deadline has already expired at submission time."
    expected_behavior: "The typed turn operation rejects it before writing or creating owned lifecycle state."
  - scenario: "Valid limits are combined with notification-only Session.Send behavior."
    expected_behavior: "The limits are mapped while the existing no-reply notification semantics remain unchanged."
  - scenario: "A raw caller supplies fields that typed validation would reject."
    expected_behavior: "The raw API preserves the caller's protocol payload and existing transport behavior."

assumptions:
  - "The profile applies to create_session, while maximum turns, token budget, and deadline apply independently to each send_message operation."
  - "Zero values mean unspecified and are omitted; a supplied maximum-turn or token-budget value must be greater than zero."
  - "An RFC3339 Z suffix is an explicit UTC timezone designator and satisfies the explicit-offset requirement alongside numeric offsets."
  - "Profile names are transmitted unchanged after validation; trimming is used only to determine whether a supplied value is blank."
  - "Validation applies only to typed helpers, because raw protocol access intentionally remains forward-compatible and caller-controlled."
  - "No live provider or credential is required to verify this feature."

constraints:
  - "All public changes are minimal, additive, and source-compatible."
  - "Protocol v1 raw APIs and documented request, subscription, and ownership behavior remain available."
  - "Owned Turn acceptance, ordered events, cancellation, and immutable terminal outcomes remain unchanged."
  - "Tests are deterministic, use controlled time and protocol peers, and do not expose sensitive values."

out_of_scope:
  - "A max_tool_steps option or protocol field."
  - "Provider credentials, provider selection, or authentication configuration."
  - "Changes to raw protocol request validation or rewriting."
  - "Changes to Turn ownership, cancellation, event ordering, terminal classification, retry, or reconnect behavior."
  - "Windows-specific runtime work or live provider validation."

