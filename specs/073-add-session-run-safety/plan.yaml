summary: |
  Extend the existing typed session surface without adding a parallel API. Add
  Profile to CreateSessionOptions and add MaxTurns, TokenBudget, and Deadline to
  SendOptions. Keep every field optional through zero-value omission, validate
  only typed helpers, and preserve the caller's valid profile and RFC3339 deadline
  text exactly when constructing the protocol v1 payload. Raw Request, Notify,
  Subscribe, and raw request construction remain untouched.

  Centralize typed option validation and send_message payload construction in
  session.go so Session.Send and Session.StartTurn cannot drift. Validation runs
  before request allocation, observations, subscriptions, or Turn construction;
  valid options then enter the existing Send acceptance/no-reply path or the
  existing owned-Turn subscription-before-write path unchanged. Expose one
  redacted typed option error that wraps a stable sentinel, cover exact mapping,
  omission, every invalid case, side-effect freedom, and legacy compatibility with
  deterministic controlled-protocol tests, then sync public documentation and run
  focused, race, repeated, and full validation.

technical_context:
  language: "Go 1.23"
  framework: "None"
  primary_dependencies:
    - name: "Go standard library"
      version: "1.23"
      purpose: "Use context, errors, strings, time.RFC3339 parsing, encoding/json, and the testing package for validation and deterministic fixtures."
    - name: "github.com/ariel-frischer/jcode-go/protocol"
      version: "module-local protocol v1"
      purpose: "Construct additive create_session and send_message RawRequest payloads while preserving raw forward-compatible APIs."
    - name: "github.com/ariel-frischer/jcode-go/transport"
      version: "module-local transport"
      purpose: "Use the existing controlled in-memory protocol peer for request capture and zero-write assertions."
  storage: "None"
  testing:
    framework: "Go testing package"
    approach: "Write focused table-driven and controlled-peer tests first; assert exact JSON keys and zero request/subscription deltas for invalid options, run focused tests repeatedly and with -race, then run go test ./... -count=1 and git diff --check."
  target_platform: "Go SDK consumers on the existing protocol v1 surface; Linux private-runtime lifecycle remains the program target and no Windows work is added"
  project_type: "library"
  performance_goals: "Validation completes locally before any protocol or lifecycle side effect; zero-value calls add no wire fields; send and owned-turn ordering, bounded queues, cancellation, and first-terminal behavior remain unchanged."
  constraints:
    - "Keep public changes minimal, additive, source-compatible, and Go-idiomatic."
    - "Preserve the exact legacy create_session and send_message payloads when new fields are zero."
    - "Validate only typed CreateSession, Send, and StartTurn helpers; do not rewrite or reject raw protocol calls."
    - "Treat empty string and zero numeric values as unspecified; reject whitespace-only supplied profiles and negative numeric values."
    - "Accept Deadline only when time.Parse(time.RFC3339, value) succeeds, the original text contains the required Z or numeric offset through that grammar, and the parsed instant is in the future at submission entry."
    - "Preserve valid Profile and Deadline strings exactly on the wire; trimming and parsing are validation-only."
    - "Perform validation before observation emission, request allocation/write, subscription creation, or Turn construction."
    - "Preserve Session.Send acceptance waits, notification-only sends, content/images, and existing error behavior."
    - "Preserve StartTurn subscription-before-write ordering, event delivery, cancellation, and immutable first-terminal results."
    - "Expose no max_tool_steps, provider credentials, provider selection, retry, replay, reconnect, or Windows runtime changes."
    - "Errors and tests identify only safe option field/class information and never include supplied values, prompts, responses, frames, credentials, or private session IDs."
    - "This planning stage writes only the supplied feature artifact and does not commit, mutate Beads, merge, push, or manage worktrees."
  scale_scope: "Four optional scalar controls on two existing typed option structs and three existing typed entry points; no persistence, service, distributed coordination, or live provider dependency."

