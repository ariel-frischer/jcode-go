research_findings:
  decisions:
    - topic: "Public option placement and zero-value compatibility"
      decision: "Add Profile string to CreateSessionOptions and MaxTurns int, TokenBudget int, and Deadline string to SendOptions, all encoded with omitempty only after validation."
      rationale: "The current API already routes session creation through CreateSessionOptions and both typed turn paths through SendOptions. Additive scalar fields preserve source compatibility and make zero values naturally omit the new protocol keys."
      alternatives_considered:
        - "Introduce separate SessionProfileOptions and RunSafetyOptions wrapper structs, which adds nesting and migration friction for only four fields."
        - "Add new CreateSessionWithProfile or SendWithLimits methods, which duplicates existing lifecycle paths and risks semantic drift."
    - topic: "Deadline representation and exact wire mapping"
      decision: "Represent Deadline as a string, validate with time.Parse(time.RFC3339), require the parsed instant to be after a captured submission-entry time, and transmit the original validated string unchanged."
      rationale: "A string retains the syntax needed to reject malformed and timezone-less input and preserves the caller's explicit Z or numeric offset. time.Time would erase whether the original input carried the required RFC3339 designator and would force normalization."
      alternatives_considered:
        - "Use time.Time, which cannot represent malformed input or preserve the caller's original explicit offset text."
        - "Use context deadlines as the protocol deadline, which conflates local lifecycle cancellation with the server run-safety field."
    - topic: "Numeric and profile validation semantics"
      decision: "Treat zero MaxTurns and TokenBudget as unspecified, reject negative values, treat empty Profile as unspecified, reject non-empty profiles whose strings.TrimSpace result is empty, and otherwise preserve profile text exactly."
      rationale: "This follows the spec's explicit zero-value assumptions while still rejecting every representable supplied non-positive or blank value without adding pointer fields solely to distinguish an explicitly assigned zero."
      alternatives_considered:
        - "Use pointer numeric and profile fields to distinguish explicit zero or empty values, which expands caller complexity and is not required by the zero-means-unspecified contract."
        - "Trim and normalize profile names, which would violate exact caller-supplied mapping."
    - topic: "Stable redacted validation errors"
      decision: "Add ErrInvalidOptions plus an exported OptionError carrying only the safe option field; OptionError.Unwrap returns ErrInvalidOptions and Error omits the rejected value."
      rationale: "Callers receive stable errors.Is and errors.As inspection in line with the constitution without parsing messages or exposing prompts, identifiers, deadlines, profile names, or other caller data."
      alternatives_considered:
        - "Return ad hoc fmt.Errorf strings, which are not a stable classification."
        - "Create one sentinel per validation rule, which adds unnecessary public surface and couples consumers to internal reasons."
    - topic: "Shared mapping and side-effect boundary"
      decision: "Keep validation and private payload structs in session.go, validate before any Client or Turn side effect, and use one private send-message request builder for both Session.Send and Session.StartTurn."
      rationale: "The current implementation duplicates send_message payload construction. One builder guarantees identical safety-field mapping while each public method retains its established no-reply, acceptance, and owned-turn control flow."
      alternatives_considered:
        - "Duplicate fields and validation in both methods, which creates avoidable drift."
        - "Move validation into protocol.NewRawRequest, which would incorrectly constrain raw forward-compatible callers."
    - topic: "Test and documentation placement"
      decision: "Add a focused session_options_test.go using existing package-level controlled peer helpers, retain existing compatibility suites, and update README.md plus docs/architecture.md with the additive option and validation boundary."
      rationale: "A dedicated test file keeps the matrix reviewable while same-package fixtures can assert request fields, request IDs, subscription IDs, and lifecycle behavior without live services. Existing docs are the canonical typed API and lifecycle contracts."
      alternatives_considered:
        - "Use live provider acceptance, which is unnecessary, costly, and explicitly out of scope."
        - "Scatter the full matrix across typed_api_test.go and turn_test.go, which obscures the feature's exact omission and side-effect contract."

data_model:
  entities:
    - name: "CreateSessionOptions"
      description: "Existing typed session-creation input extended with optional profile selection."
      fields:
        - name: "WorkingDir"
          type: "string"
          description: "Existing harness session working directory."
          constraints: "Behavior and json mapping remain unchanged; empty remains omitted."
        - name: "Profile"
          type: "string"
          description: "Optional named harness profile mapped to profile."
          constraints: "Empty means omitted; non-empty whitespace-only is invalid; valid text is transmitted unchanged."
      relationships:
        - target: "create_session request"
          type: "one-to-one"
          description: "One validated typed option value maps to one optional protocol field."
    - name: "SendOptions"
      description: "Existing typed send input extended with optional per-turn safety limits shared by normal sends and owned turns."
      fields:
        - name: "Images"
          type: "[][2]string"
          description: "Existing image payload copied before encoding."
          constraints: "Behavior and omission remain unchanged."
        - name: "NoReply"
          type: "bool"
          description: "Existing notification-only selection for Session.Send."
          constraints: "StartTurn continues to reject true with ErrTurnNoReply; false remains omitted."
        - name: "MaxTurns"
          type: "int"
          description: "Optional maximum-turn limit mapped to max_turns."
          constraints: "Zero means omitted; negative is invalid; positive is transmitted exactly."
        - name: "TokenBudget"
          type: "int"
          description: "Optional token budget mapped to token_budget."
          constraints: "Zero means omitted; negative is invalid; positive is transmitted exactly."
        - name: "Deadline"
          type: "string"
          description: "Optional absolute RFC3339 deadline mapped to deadline."
          constraints: "Empty means omitted; otherwise must parse as RFC3339 with Z or numeric offset and be later than submission-entry time; valid text is preserved."
      relationships:
        - target: "send_message request"
          type: "one-to-one"
          description: "One validated SendOptions value maps consistently through both typed send paths."
    - name: "OptionError"
      description: "Redacted stable validation failure returned by typed helpers before side effects."
      fields:
        - name: "Field"
          type: "string"
          description: "Safe stable name of the invalid option field."
          constraints: "Contains no rejected value, prompt, response, frame, credential, or private identifier."
        - name: "wrapped sentinel"
          type: "error"
          description: "ErrInvalidOptions exposed through errors.Is."
          constraints: "All typed option validation failures unwrap to the same stable sentinel."
      relationships:
        - target: "CreateSessionOptions"
          type: "many-to-one"
          description: "Profile validation may return an OptionError."
        - target: "SendOptions"
          type: "many-to-one"
          description: "MaxTurns, TokenBudget, or Deadline validation may return an OptionError."
    - name: "Typed protocol payload"
      description: "Private additive JSON field set used to construct protocol v1 RawRequest values."
      fields:
        - name: "create_session fields"
          type: "private struct"
          description: "working_dir plus optional profile."
          constraints: "Zero-value new fields are absent from JSON."
        - name: "send_message fields"
          type: "private struct"
          description: "Existing session_id, content, images, and no_reply plus optional max_turns, token_budget, and deadline."
          constraints: "Shared by Send and StartTurn after typed validation; raw callers never pass through it."
      relationships:
        - target: "protocol.RawRequest"
          type: "one-to-one"
          description: "The validated private field struct is encoded by protocol.NewRawRequest without protocol package changes."

api_contracts:
  endpoints:
    - method: "Go API"
      path: "Client.CreateSession"
      description: "Creates a typed session with an optional named profile while preserving the zero-value legacy request."
      request:
        content_type: "in-process Go call"
        body_schema: "context.Context and CreateSessionOptions{WorkingDir string, Profile string}; empty Profile is omitted."
      response:
        success_code: 200
        body_schema: "Session with existing SessionInfo and ID behavior."
      errors:
        - code: 400
          description: "OptionError wrapping ErrInvalidOptions for a non-empty whitespace-only Profile, returned before observation or request activity."
        - code: 503
          description: "Existing request encoding, timeout, transport, protocol, or server reply error behavior."
    - method: "Go API"
      path: "Session.Send"
      description: "Submits send_message with optional MaxTurns, TokenBudget, and Deadline while preserving acceptance-wait and NoReply notification behavior."
      request:
        content_type: "in-process Go call"
        body_schema: "context.Context, content string, and SendOptions{Images, NoReply, MaxTurns, TokenBudget, Deadline}; zero safety fields are omitted."
      response:
        success_code: 200
        body_schema: "error; nil after message_accepted for reply sends or after the notification write for NoReply sends."
      errors:
        - code: 400
          description: "OptionError wrapping ErrInvalidOptions for negative limits, malformed or timezone-less deadline, or expired deadline, before request or subscription activity."
        - code: 408
          description: "Existing acceptance wait context interruption with unknown server-side mutation outcome and no automatic retry."
        - code: 503
          description: "Existing write, subscription, protocol, transport, or client closure error behavior."
    - method: "Go API"
      path: "Session.StartTurn"
      description: "Starts the existing owned Turn with the same validated safety fields and unchanged subscription-before-write lifecycle."
      request:
        content_type: "in-process Go call"
        body_schema: "lifecycle context, content string, and SendOptions with NoReply false and optional positive limits plus future RFC3339 Deadline."
      response:
        success_code: 200
        body_schema: "*Turn returned after successful write and before acceptance, with existing Accepted, Next, Cancel, and Wait semantics."
      errors:
        - code: 400
          description: "Existing ErrTurnNoReply or OptionError wrapping ErrInvalidOptions, with invalid safety options rejected before subscription, Turn, observation, request, or write creation."
        - code: 408
          description: "Existing ended lifecycle context behavior before an owned turn is created."
        - code: 503
          description: "Existing request encoding or transport write error; no retry or replay."

