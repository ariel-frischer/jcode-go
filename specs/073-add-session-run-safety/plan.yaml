implementation_phases:
  - phase: 1
    name: "Write the option contract tests first"
    goal: "Make omission, exact mapping, validation classification, side-effect freedom, redaction, and legacy lifecycle behavior executable before production changes."
    deliverables:
      - "Add exact JSON-key assertions for zero-value CreateSessionOptions and SendOptions, proving profile, max_turns, token_budget, and deadline are absent while existing fields are unchanged."
      - "Add exact valid mapping cases for Profile and for each safety field independently and together on Session.Send, NoReply Send, and Session.StartTurn."
      - "Add table-driven invalid cases for whitespace-only profile, negative limits, malformed deadline, missing timezone designator, and expired deadline, asserting errors.Is ErrInvalidOptions and errors.As OptionError without rejected values in error text."
      - "Capture Client request/subscription counters and controlled peer traffic to prove invalid CreateSession, Send, and StartTurn cases create zero requests, writes, subscriptions, observations, or owned Turns."
      - "Retain raw request coverage demonstrating fields bypass typed validation and add compatibility assertions for content, images, acceptance return point, NoReply notification behavior, and StartTurn subscription-before-write ordering."
  - phase: 2
    name: "Implement additive options and pre-side-effect validation"
    goal: "Add the minimum public and private code needed to map valid values identically through both typed turn paths and reject invalid values locally."
    dependencies:
      - "Phase 1"
    deliverables:
      - "Add Profile, MaxTurns, TokenBudget, and Deadline to the existing option structs without changing method signatures or legacy fields."
      - "Add ErrInvalidOptions and redacted OptionError with errors.Is/errors.As-compatible behavior and safe field-only diagnostics."
      - "Implement private create-session and send-option validators; capture submission time once, parse Deadline with time.RFC3339, require a future instant, and never normalize valid caller text."
      - "Move CreateSession validation before create_session_start observation and request construction."
      - "Build create_session with optional profile and route Send and StartTurn through one private send_message payload builder after validation."
      - "Keep Send's subscription/acceptance and NoReply branches and StartTurn's lifecycle guards, subscription creation, dispatcher start, write completion, and terminal handling otherwise unchanged."
  - phase: 3
    name: "Compatibility, documentation, and focused concurrency validation"
    goal: "Prove the additive mapping does not alter raw APIs or owned lifecycle semantics and make the public contract discoverable."
    dependencies:
      - "Phase 2"
    deliverables:
      - "Run the focused option and legacy session tests, then run the focused deterministic option matrix with -count=10 to satisfy reproducibility evidence."
      - "Run focused -race tests covering Session.Send and StartTurn option mapping, invalid pre-subscription rejection, acceptance ordering, cancellation, and terminal behavior."
      - "Update README.md with concise usage and validation examples and update docs/architecture.md with the typed-validation boundary and unchanged ownership semantics."
      - "Verify no public or serialized field named max_tool_steps and no provider credential or authentication field was introduced."
  - phase: 4
    name: "Repository validation and orchestrator handoff"
    goal: "Complete bounded local evidence while preserving the assigned worker and integration boundary."
    dependencies:
      - "Phase 3"
    deliverables:
      - "Run gofmt on explicitly changed Go files, focused tests first, go test ./... -count=1 once, and git diff --check."
      - "Inspect the explicit diff for zero-value request compatibility, raw protocol isolation, redaction, accidental max_tool_steps/provider fields, and unrelated changes."
      - "During implementation, stage only explicitly changed files and create the scoped worker commit when the coordinator contract requests it; do not merge, push, mutate Beads, or clean worktrees."
      - "Report the scoped files, commit if created, focused/repeated/race/full validation evidence, residual risks, and readiness for coordinator review and fresh-base validation."

