  spec_path: "specs/071-add-tool-exec/spec.yaml"

summary: |
  Add ToolExec as one exported peer of ToolStart, ToolInputDelta, and ToolDone in
  the existing typed event surface. The struct will contain only SessionID,
  CallID, and Name string fields with the canonical JSON names, and
  decodeTypedEvent will recognize only the exact tool_exec kind before using the
  existing Event.Decode path. This keeps protocol v1 framing and raw event access
  unchanged.

  Add focused table-driven typed tests for all four tool lifecycle event kinds,
  exact ToolExec value preservation, empty-string preservation, and genuinely
  unknown or near-match kinds. Add protocol coverage proving tool_exec remains a
  known RawEvent whose three canonical values survive decoding, while an unknown
  kind remains protocol.UnknownEvent. No lifecycle, Locus, provider, ownership,
  or unrelated event changes are included. README only lists ToolExec alongside
  the existing typed-stream event family.

