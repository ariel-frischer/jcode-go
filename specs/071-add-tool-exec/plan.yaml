research_findings:
  decisions:
    - topic: "Canonical ToolExec field contract"
      decision: "Define exported type ToolExec with SessionID, CallID, and Name string fields tagged session_id, call_id, and name."
      rationale: "The authoritative Rust ApiEvent::ToolExec contract contains exactly those three strings, and translate.rs maps ServerEvent::ToolExec id to call_id while adding the session identifier."
      alternatives_considered:
        - "Reuse ToolStart by aliasing it, which obscures the distinct lifecycle event and its concrete type."
        - "Add output, input, error, timestamps, or optional fields, which are not present in the canonical contract."
    - topic: "Typed decoder integration point"
      decision: "Add one exact tool_exec case beside tool_start, tool_input_delta, and tool_done in decodeTypedEvent and use the existing Event.Decode method."
      rationale: "This is the established typed event pattern and preserves JSON decoding behavior, malformed-event handling, and the TypedEvent interface without a parallel decoder."
      alternatives_considered:
        - "Decode ToolExec in Client or protocol, which would cross the existing raw-versus-typed layer boundary."
        - "Classify by payload shape, which would weaken exact-kind and UnknownEvent semantics."
    - topic: "Raw protocol behavior"
      decision: "Do not change protocol.knownEvents because tool_exec is already present; add a regression test that it decodes to RawEvent and preserves canonical fields."
      rationale: "The current protocol layer correctly distinguishes known raw events from genuinely unknown kinds, so implementation belongs only in the typed SDK layer."
      alternatives_considered:
        - "Add a protocol.ToolExec type, which changes the raw protocol API and duplicates the typed surface."
        - "Remove tool_exec from knownEvents and decode it elsewhere, which would regress existing raw behavior."
    - topic: "Focused compatibility coverage"
      decision: "Use table-driven typed decoding coverage for ToolStart, ToolInputDelta, ToolExec, ToolDone, an unknown kind, and a near-match kind; separately assert raw protocol value preservation and unknown classification."
      rationale: "This directly exercises the requested peer mapping, exact spelling, value fidelity, empty values, and fail-closed behavior with minimal test surface."
      alternatives_considered:
        - "Exercise only a full fake-server stream, which is slower and makes decoder failures less local."
        - "Test only ToolExec success, which would not prove preservation of neighboring mappings or UnknownEvent behavior."

data_model:
  entities:
    - name: "ToolExec"
      description: "Exported typed SDK event indicating that a named tool call is being executed in a session."
      fields:
        - name: "SessionID"
          type: "string"
          description: "Session identifier decoded from session_id."
          constraints: "Preserved exactly; empty string remains empty."
        - name: "CallID"
          type: "string"
          description: "Tool call identifier decoded from call_id, originating from ServerEvent::ToolExec id."
          constraints: "Preserved exactly; empty string remains empty."
        - name: "Name"
          type: "string"
          description: "Canonical tool name decoded from name."
          constraints: "Preserved exactly; empty string remains empty."
      relationships:
        - target: "TypedEvent"
          type: "many-to-one"
          description: "ToolExec implements the existing closed-package typedEvent marker and is returned through TypedEvent."
        - target: "protocol.RawEvent"
          type: "one-to-one"
          description: "A known raw tool_exec event is converted to one ToolExec value by the typed decoder."
    - name: "UnknownEvent"
      description: "Existing fail-closed typed representation for an event kind not recognized by decodeTypedEvent."
      fields:
        - name: "Kind"
          type: "string"
          description: "The unrecognized event kind."
          constraints: "Exact unknown spelling is retained; tool_exec is excluded after this feature."
        - name: "Fields"
          type: "json.RawMessage"
          description: "The existing untouched raw payload fields."
          constraints: "Semantics and storage remain unchanged."
      relationships:
        - target: "TypedEvent"
          type: "many-to-one"
          description: "UnknownEvent continues to implement TypedEvent for genuinely unknown kinds."

api_contracts:
  endpoints:
    - method: "Go API"
      path: "ToolExec"
      description: "Exported typed event value returned when an exact tool_exec event is decoded."
      request:
        content_type: "application/json"
        body_schema: "Existing Event with Kind tool_exec and Fields containing string session_id, call_id, and name."
      response:
        success_code: 200
        body_schema: "*ToolExec with exported SessionID, CallID, and Name string fields."
      errors:
        - code: 400
          description: "Existing Event.Decode error behavior for malformed canonical field types; unchanged by this feature."
    - method: "Go API"
      path: "decodeTypedEvent"
      description: "Existing private conversion from Event to TypedEvent, extended only for the exact tool_exec kind."
      request:
        content_type: "in-process Go value"
        body_schema: "Event containing Kind and raw Fields."
      response:
        success_code: 200
        body_schema: "*ToolExec for tool_exec; existing peer types for tool_start, tool_input_delta, and tool_done; UnknownEvent for genuinely unknown kinds."
      errors:
        - code: 400
          description: "Existing JSON decoding error for a recognized event whose field types cannot be decoded."

