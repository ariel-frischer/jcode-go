feature:
  branch: "agent/jcode-go-70h-4"
  created: "2026-08-10"
  status: "Draft"
  input: |
    Bead jcode-go-70h.4: unify stable typed terminal outcomes for successful turn completion, explicit server cancellation, local lifecycle context cancellation, lifecycle deadline timeout, provider failure, protocol or framing failure, subscriber overflow, owned bridge exit, transport disconnect, and local client close. One turn records one immutable first terminal result. EOF and bridge death must always produce explicit outcomes. Preserve Session.Send, Session.Events, raw protocol v1 APIs, explicit reconnect, and ownership contracts. Use existing EventError, Turn, subscriptions, connection state, protocol events, and errors.Is/errors.As conventions. Do not add retries, string parsing, reconnect automation, fallback, generic lifecycle frameworks, or Windows scope. Require deterministic concurrency, no leaks, no blocked event consumers, no double close, no races, and redacted errors. Cover every class and conflicting completion/cancel/provider/transport/overflow signals with unit and race tests. Planning artifacts only: remain on the current assigned branch, do not create or switch git branches, do not commit, do not mutate Beads, and use the fixed specs/070-typed-terminal-outcomes directory supplied by the process-local Autospec wrapper.

clarifications:
  - date: "2026-08-10"
    question: "What additive public API must expose stable terminal classifications without breaking the landed turn contract?"
    answer: "Export stable TurnResultKind constants, preserve established result strings, and use typed or sentinel causes inspected with errors.Is/errors.As."
    applied_to: "requirements.functional.FR-001, FR-005, FR-011; key_entities.TurnResult; assumptions"
  - date: "2026-08-10"
    question: "What does an ordinary disconnect do to raw subscriptions versus owned Turn subscriptions?"
    answer: "Raw subscriptions retain explicit-reconnect compatibility; owned Turn subscriptions terminate on ordinary disconnect and are never replayed or revived."
    applied_to: "requirements.functional.FR-007 and FR-010; user_stories.US-003; edge_cases; assumptions"
  - date: "2026-08-10"
    question: "What evidence and precedence classify an owned bridge exit when it races with EOF?"
    answer: "Use only SDK ownership evidence; the first synchronized terminal commit wins, so a later bridge signal cannot upgrade a transport result."
    applied_to: "requirements.functional.FR-007; user_stories.US-003; key_entities.Owned bridge instance; edge_cases; assumptions"
  - date: "2026-08-10"
    question: "Which provider and transport details may typed terminal causes and observations retain?"
    answer: "Retain safe kinds, codes, and sentinels; redact unsafe provider and transport text while preserving raw API compatibility."
    applied_to: "requirements.functional.FR-005 and FR-011; requirements.non_functional.NFR-002; key_entities.EventError; edge_cases; assumptions"

user_stories:
  - id: "US-001"
    title: "Receive one stable terminal outcome per turn"
    priority: "P0"
    as_a: "SDK caller"
    i_want: "a typed, immutable terminal result that identifies why each owned turn ended"
    so_that: "I can handle completion and failure deterministically without parsing messages or protocol frames"
    why_this_priority: "Every downstream lifecycle decision depends on a single authoritative outcome."
    independent_test: "Drive an owned turn through each supported terminal scenario and verify its result kind, cause inspection, and repeated waits."
    acceptance_scenarios:
      - given: "An owned turn receives a successful turn completion event"
        when: "The turn reaches its terminal state"
        then: "The result identifies successful completion, stores no replacement result later, and every later wait returns the same value."
      - given: "An owned turn receives a provider failure, protocol or framing failure, subscriber overflow, transport disconnect, owned bridge exit, or local client close"
        when: "The first applicable terminal signal is processed"
        then: "The result identifies the corresponding distinct terminal class and preserves a safe typed cause for inspection."
      - given: "Completion, cancellation, provider, transport, or overflow signals race"
        when: "More than one signal is presented to the turn"
        then: "The first signal serialized by the turn's terminal synchronization point remains authoritative and later signals cannot mutate the stored result."

  - id: "US-002"
    title: "Distinguish server cancellation from local lifecycle stop"
    priority: "P0"
    as_a: "SDK caller supervising a turn"
    i_want: "server cancellation, lifecycle cancellation, and lifecycle deadline expiry to remain separate outcomes"
    so_that: "I can decide whether server work was explicitly stopped, locally abandoned, or exceeded its lifecycle budget"
    why_this_priority: "Conflating these causes can cause incorrect retry, cleanup, or user-facing handling of mutating work."
    independent_test: "Run the same turn fixture with explicit cancellation, canceled lifecycle context, deadline context, and canceled wait contexts, then compare terminal and wait results."
    acceptance_scenarios:
      - given: "A live turn and a caller invokes explicit turn cancellation"
        when: "The cancellation request succeeds and the server later reports cancellation"
        then: "The turn records explicit server cancellation; the successful cancellation request alone is not terminal, and concurrent cancellation calls share one request and result."
      - given: "A live turn whose lifecycle context is canceled"
        when: "The lifecycle watcher observes cancellation"
        then: "The turn records local lifecycle context cancellation and does not construct or send a protocol cancellation request."
      - given: "A live turn whose lifecycle context reaches its deadline"
        when: "The deadline expires before another terminal signal wins"
        then: "The turn records a distinct lifecycle deadline outcome with an inspectable deadline cause."
      - given: "A caller cancels only the context passed to acceptance, event, cancellation, or terminal waiting"
        when: "That individual method is waiting and the turn is still live"
        then: "Only that method call is interrupted; the turn remains live and can later produce its immutable terminal result."

  - id: "US-003"
    title: "Make connection and subscription failures explicit"
    priority: "P0"
    as_a: "SDK caller using a live session"
    i_want: "EOF, bridge exit, transport failure, client close, and subscriber overflow to wake affected consumers with explicit outcomes"
    so_that: "No turn or event consumer waits forever and unrelated subscriptions remain isolated"
    why_this_priority: "Lifecycle failures otherwise leave ambiguous work, blocked consumers, and unsafe cleanup races."
    independent_test: "Use controlled transports, owned bridge fixtures, and bounded subscriber queues to inject each failure while observing all affected consumers."
    acceptance_scenarios:
      - given: "An active turn receives ordinary EOF or another transport disconnect"
        when: "The client marks its connection unhealthy"
        then: "The owned turn records an explicit transport-disconnect outcome and wakes its waiters without automatically reconnecting, replaying, or reviving the turn; raw subscriptions retain their documented explicit-reconnect compatibility."
      - given: "A launched client owns a bridge that exits while a turn is active"
        when: "The exit is observed"
        then: "The turn records an owned-bridge-exit outcome only when the SDK has positive ownership evidence tying the exit to its attached private instance; otherwise it records transport disconnect."
      - given: "A raw or turn subscription exceeds its bounded delivery capacity"
        when: "The subscriber falls behind"
        then: "Only the affected subscription or turn terminates with subscriber overflow; the client reader, request correlation, and other subscribers continue without blocking."
      - given: "The local client is closed while a turn is active"
        when: "Close wakes the turn"
        then: "The turn records the existing local client-close cause, repeated close calls do not double-close resources, and all affected waiters are released."

  - id: "US-004"
    title: "Preserve compatible APIs and safe error inspection"
    priority: "P1"
    as_a: "Existing jcode-go consumer"
    i_want: "the current session, raw protocol, reconnect, ownership, and event APIs to retain their documented behavior while outcomes become typed"
    so_that: "I can adopt terminal classification without rewriting existing protocol or lifecycle code"
    why_this_priority: "Compatibility is required for incremental SDK adoption and safe migration of callers."
    independent_test: "Run existing Session.Send, Session.Events, Request, Notify, Subscribe, explicit reconnect, Close, and ownership tests alongside typed-outcome tests."
    acceptance_scenarios:
      - given: "An existing caller uses Session.Send, including notification-only behavior"
        when: "The caller sends a message"
        then: "The existing signature and acceptance-only semantics remain unchanged, with no implicit turn completion wait or server cancellation."
      - given: "An existing caller uses Session.Events or raw protocol v1 access"
        when: "Events, replies, or unknown forward-compatible kinds are consumed"
        then: "The existing APIs and ownership rules remain available and explicit reconnect remains caller-controlled."
      - given: "A provider or lifecycle failure is returned to a caller"
        when: "The caller uses errors.Is or errors.As"
        then: "The stable terminal kind and existing typed causes such as EventError, ErrClosed, ErrDisconnected, or ErrSubscriberOverflow are discoverable without string parsing, while owned-turn diagnostics omit unsafe provider and transport text and existing raw API behavior remains compatible."

requirements:
  functional:
    - id: "FR-001"
      description: "MUST expose exported stable TurnResultKind constants for every required turn outcome: successful completion, explicit server cancellation, local lifecycle cancellation, lifecycle deadline expiry, provider failure, protocol or framing failure, subscriber overflow, owned bridge exit, transport disconnect, and local client close. Existing result string values remain unchanged when already established; new classes use distinct stable values. Each result exposes a typed or sentinel cause that callers inspect with errors.Is or errors.As rather than message parsing."
      testable: true
      acceptance_criteria: "A focused test drives one turn through each class and verifies a distinct stable kind and the documented cause."
    - id: "FR-002"
      description: "MUST record exactly one immutable first terminal result per owned turn, with all later waits returning the same result and all later terminal signals unable to replace it."
      testable: true
      acceptance_criteria: "Repeated waits and forced conflicting terminal races return byte-for-byte equivalent kind and equivalent inspectable cause, with no second terminal transition."
    - id: "FR-003"
      description: "MUST distinguish natural successful turn completion from explicit server cancellation, and MUST treat a successful cancellation request as non-terminal until the server reports the turn's terminal cancellation event."
      testable: true
      acceptance_criteria: "Tests verify that a server completion and a server cancellation produce different kinds, while a successful cancellation request alone leaves the turn non-terminal."
    - id: "FR-004"
      description: "MUST distinguish local lifecycle context cancellation from lifecycle deadline expiry, preserve the applicable context cause for errors.Is or errors.As inspection, and MUST NOT send protocol cancellation for either local lifecycle signal."
      testable: true
      acceptance_criteria: "Canceled and deadline-bound lifecycle contexts produce their respective kinds, retain inspectable causes, and record zero protocol cancel writes."
    - id: "FR-005"
      description: "MUST preserve provider failures as typed EventError-compatible causes with stable provider codes, while classifying protocol or framing failures separately from provider failures. TurnResult causes retain only safe provider classification, transport sentinels, or typed protocol causes and support errors.Is or errors.As; unsafe provider and transport text is redacted."
      testable: true
      acceptance_criteria: "Provider event fixtures satisfy errors.As for EventError and expose the code, while malformed or invalid frames satisfy the protocol or framing classification without being treated as provider errors."
    - id: "FR-006"
      description: "MUST terminate only the affected subscriber or turn on bounded subscriber overflow and MUST keep the client reader, request correlation, other subscribers, and unrelated event consumers non-blocking."
      testable: true
      acceptance_criteria: "A slow subscriber overflows deterministically, receives an explicit overflow result, and does not prevent another subscriber or pending request from progressing."
    - id: "FR-007"
      description: "MUST convert EOF and every owned bridge exit observed during an active turn into an explicit terminal outcome, distinguishing an owned bridge exit from an unowned transport disconnect only through positive SDK ownership evidence. The implementation MUST NOT infer bridge ownership from generic EOF, provider or transport text, a socket path, or an untrusted PID. If bridge exit and EOF race, the first terminal signal committed at the turn synchronization point wins and later evidence cannot upgrade the stored result. Ordinary disconnect terminates owned Turn subscriptions, while raw subscriptions retain explicit-reconnect compatibility and no turn is replayed or revived."
      testable: true
      acceptance_criteria: "Controlled EOF, owned bridge exit, and unowned disconnect tests each wake the active turn and verify the required distinct classification without relying on error-string parsing."
    - id: "FR-008"
      description: "MUST classify local client closure with the existing ErrClosed contract and MUST release all affected turn waiters and event consumers without double close or panic."
      testable: true
      acceptance_criteria: "Concurrent and repeated Client.Close calls produce one cleanup result, wake active turns, preserve errors.Is with ErrClosed, and leave no blocked waiter."
    - id: "FR-009"
      description: "MUST keep contexts supplied only to Accepted, Next, Cancel, or Wait scoped to those individual method calls and MUST NOT terminate an otherwise live turn."
      testable: true
      acceptance_criteria: "Canceling each wait context before a terminal signal returns that call's context error, after which the same turn can still be completed and waited successfully."
    - id: "FR-010"
      description: "MUST preserve Session.Send, Session.Events, Request, Notify, Subscribe, raw protocol v1 behavior, explicit reconnect, and documented instance ownership contracts without retries, replay, reconnect automation, fallback, or signature-breaking changes."
      testable: true
      acceptance_criteria: "Existing compatibility and ownership tests pass, explicit reconnect remains caller initiated, and an interrupted mutating operation is never automatically replayed."
    - id: "FR-011"
      description: "MUST make owned-turn terminal results, typed causes, and lifecycle observations safe to inspect without exposing prompts, credentials, tokens, response content, raw protocol frames, private session identifiers, or unsafe provider and transport text. Existing raw protocol APIs retain their established behavior and are not broadened by this feature."
      testable: true
      acceptance_criteria: "Redaction tests assert that protected fixture values are absent from errors, observations, and test receipts while safe phase metadata and provider codes remain available."
    - id: "FR-012"
      description: "MUST provide unit and race-enabled coverage for every terminal class, every required conflicting completion/cancel/provider/transport/overflow signal combination, repeated waits, close races, cancellation serialization, and cleanup liveness."
      testable: true
      acceptance_criteria: "The focused lifecycle suite and applicable race suite cover the complete outcome matrix and finish without race reports, deadlocks, goroutine leaks, panics, or blocked event consumers."
  non_functional:
    - id: "NFR-001"
      category: "reliability"
      description: "Terminal classification and lifecycle cleanup remain deterministic and live under concurrent event delivery, cancellation, transport failure, overflow, and closure."
      measurable_target: "100% of repeated focused and race-enabled scenarios finish without deadlock, panic, double close, blocked consumer, or detected data race."
    - id: "NFR-002"
      category: "security"
      description: "All public terminal errors and lifecycle observations are redacted while retaining stable machine-actionable classifications."
      measurable_target: "Zero occurrences of prompts, credentials, tokens, response content, raw frames, or private session identifiers in redaction-test output."
    - id: "NFR-003"
      category: "code_quality"
      description: "Callers can classify terminal outcomes through typed values and wrapped causes rather than human-readable message parsing."
      measurable_target: "Every required failure class is covered by successful errors.Is or errors.As assertions in focused tests."
    - id: "NFR-004"
      category: "reliability"
      description: "Existing public protocol and ownership behavior remains compatible while the additive terminal outcome contract is introduced."
      measurable_target: "The complete existing SDK test suite passes with zero signature-breaking or ownership-regression failures."

success_criteria:
  measurable_outcomes:
    - id: "SC-001"
      description: "SDK callers receive exactly one stable terminal classification for every supported completion, cancellation, lifecycle, provider, protocol, subscription, bridge, transport, and close scenario."
      metric: "Number of supported terminal scenarios with one immutable, inspectable result"
      target: "100% of the 10 required terminal classes"
    - id: "SC-002"
      description: "Conflicting terminal signals produce a repeatable first-winner result rather than nondeterministic replacement or duplicate completion."
      metric: "Repeated executions of the defined completion, cancel, provider, transport, and overflow conflict matrix"
      target: "100% of conflict cases return the same first serialized result on every repetition"
    - id: "SC-003"
      description: "Existing users can continue using session, event, raw protocol, reconnect, and ownership APIs without behavioral migration forced by terminal outcome support."
      metric: "Compatibility and ownership scenarios covering existing public paths"
      target: "100% pass with no signature changes, implicit replay, or automatic reconnect"
    - id: "SC-004"
      description: "Terminal failures wake affected callers promptly enough that no consumer or cleanup owner remains indefinitely blocked."
      metric: "Lifecycle stress and race scenarios exercising EOF, bridge exit, overflow, disconnect, and close"
      target: "Zero blocked event consumers, leaked lifecycle goroutines, duplicate closes, or orphaned owned resources after each scenario"
    - id: "SC-005"
      description: "Callers and operators can diagnose terminal classes without exposure of protected request or session data."
      metric: "Redacted error and observation inspection"
      target: "Zero protected values emitted and 100% of required kinds discoverable through typed inspection"

key_entities:
  - name: "TurnResult"
    description: "The immutable terminal record returned for one owned turn."
    attributes:
      - "exported stable terminal kind constant"
      - "typed or sentinel cause inspectable with errors.Is or errors.As"
      - "first-terminal-wins identity"
  - name: "Turn"
    description: "The owned lifecycle handle that accepts, streams, cancels, and waits for one session turn."
    attributes:
      - "lifecycle context"
      - "acceptance and ordered event state"
      - "single terminal result"
  - name: "EventError"
    description: "The typed provider failure cause emitted by the harness event protocol; owned-turn results retain its safe provider code while omitting unsafe message text."
    attributes:
      - "stable provider code"
      - "redacted owned-turn diagnostic message"
      - "errors.As compatibility"
  - name: "Subscription"
    description: "A bounded event delivery ownership unit whose overflow is isolated to its consumer."
    attributes:
      - "event stream"
      - "bounded capacity"
      - "terminal subscription error"
  - name: "Client connection"
    description: "The protocol and transport owner that detects EOF, framing failure, disconnect, and local close."
    attributes:
      - "connection state"
      - "raw protocol v1 access"
      - "explicit reconnect boundary"
  - name: "Owned bridge instance"
    description: "The Linux private runtime whose observed process exit is distinct from an unowned socket disconnect only when SDK ownership evidence is available."
    attributes:
      - "process ownership"
      - "bridge exit signal"
      - "bounded cleanup responsibility"

edge_cases:
  - scenario: "A successful turn completion event races with explicit cancellation, provider failure, transport disconnect, or subscriber overflow."
    expected_behavior: "The first signal serialized by the turn's terminal synchronization point wins; all later signals are late observations and cannot replace the stored result."
  - scenario: "A lifecycle context is canceled or reaches its deadline at the same time as a server terminal event."
    expected_behavior: "The first serialized terminal signal determines the immutable result; cancellation is never converted into a protocol cancel request."
  - scenario: "A terminal event arrives before message acceptance is observed by the acceptance waiter."
    expected_behavior: "The turn still records the terminal result, wakes acceptance waiters consistently, and does not report successful acceptance after a pre-acceptance failure."
  - scenario: "A successful explicit cancellation request is followed by no server cancellation event before the caller's Cancel wait context expires."
    expected_behavior: "The Cancel call may be interrupted for that caller, but the turn is not falsely marked terminal and no retry is attempted."
  - scenario: "EOF occurs before or after acceptance on a connected client."
    expected_behavior: "The active owned turn receives an explicit transport-disconnect result rather than waiting for a future explicit reconnect; independent raw subscriptions retain their existing explicit-reconnect behavior."
  - scenario: "An SDK-owned bridge exits while its socket also reports EOF."
    expected_behavior: "The owned turn is classified as owned bridge exit only when positive SDK ownership evidence is available and that signal commits first; if EOF commits first, transport disconnect remains authoritative, and neither signal may retroactively replace the first result."
  - scenario: "A Connect-created client receives EOF without owning a bridge process."
    expected_behavior: "The active owned turn is classified as transport disconnect, raw subscriptions remain compatible with explicit reconnect, and reconnect cannot revive or replay the old turn."
  - scenario: "A terminal event cannot be delivered because the turn consumer has filled its bounded queue."
    expected_behavior: "Subscriber overflow wins for that turn, wakes Wait, and does not block the client reader or other subscriptions."
  - scenario: "Client.Close, subscription Close, Turn.Cancel, and event dispatch happen concurrently or are repeated."
    expected_behavior: "Ownership cleanup is idempotent, exactly one terminal result is published, no channel is double-closed, and all affected waiters eventually return."
  - scenario: "A caller cancels the context used only by Accepted, Next, or Wait."
    expected_behavior: "Only that call returns its context error; a later call observes the same live turn or immutable terminal result."
  - scenario: "A provider error contains server text or a fixture includes sensitive request data."
    expected_behavior: "Typed inspection retains only safe provider classification, transport sentinels, and bounded phase metadata; unsafe provider or transport text and protected content are absent from owned-turn errors and observations, without changing established raw API behavior."

assumptions:
  - "The current assigned branch is authoritative for this planning-only run; no feature branch is created or switched, and the fixed directory name supplies feature number 070."
  - "First terminal means the order established by one synchronized terminal commit point, not an unsynchronized wall-clock comparison."
  - "The existing EventError, ErrClosed, ErrDisconnected, and ErrSubscriberOverflow values remain the canonical inspectable causes where applicable."
  - "A lifecycle context supplied when starting a turn controls the turn lifecycle, while contexts supplied to Accepted, Next, Cancel, or Wait control only those individual calls."
  - "Owned bridge classification is available only from positive SDK evidence for an attached SDK-owned private instance; Connect has no process ownership and therefore classifies EOF as transport disconnect."
  - "Raw subscriptions retain explicit-reconnect compatibility after ordinary disconnect; an owned Turn subscription terminates immediately with a transport-disconnect outcome and is never revived or replayed."
  - "Owned-turn causes and lifecycle observations expose only safe kinds, provider codes, sentinels, and bounded phase metadata; unsafe provider and transport text is redacted, while established raw protocol behavior remains compatible."
  - "The implementation will use additive exported TurnResultKind constants and preserve existing method signatures, ownership semantics, and already-established result string values."

constraints:
  - "Planning artifacts only: remain on the current assigned branch, do not create or switch branches, do not commit, and do not mutate Beads."
  - "Write only the fixed specs/070-typed-terminal-outcomes artifact directory supplied by the process-local Autospec wrapper."
  - "Preserve Session.Send, Session.Events, raw protocol v1 APIs, explicit reconnect, and documented Client, Instance, and DetachInstance ownership contracts."
  - "Scope private-runtime supervision and bridge outcomes to Linux; do not add or expand Windows implementation work."
  - "Do not add retries, automatic reconnect, replay, fallback, string parsing, or a generic lifecycle framework."
  - "Require deterministic concurrency, bounded subscriptions, no leaks, no blocked event consumers, no double close, no races, and redacted errors."

out_of_scope:
  - "Changing Session.Send or Session.Events signatures or turning them into implicit turn supervisors."
  - "Automatic reconnect, retry, replay, provider fallback, or policy decisions outside the SDK lifecycle contract."
  - "A generic cross-component lifecycle framework."
  - "Windows process supervision or parity work."
  - "Provider selection, Locus workflow policy, live OAuth validation, or unredacted production diagnostics."
  - "Implementation, integration, or Bead state changes during this planning-artifact stage."

